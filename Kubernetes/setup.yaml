kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka-cluster
nodes:
  # Control plane node
  - role: control-plane
    image: kindest/node:v1.31.0
  # Worker nodes (at least 2 is recommended for CKA to practice scheduling, affinity, and troubleshooting)
  - role: worker
    image: kindest/node:v1.31.0
  - role: worker
    image: kindest/node:v1.31.0
