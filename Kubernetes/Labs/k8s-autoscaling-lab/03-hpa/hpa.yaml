# HPA v2: nuevo API estable (desde 1.23). Permite múltiples métricas
# y políticas de behavior (scaleUp/scaleDown).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-demo
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 50% sobre el 'request' (100m) → cada réplica debe rondar 50m.
          averageUtilization: 50
  behavior:
    scaleUp:
      # Sube rápido: hasta el doble de réplicas cada 30s.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Baja despacio para evitar flapping.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
