services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: local-surrealdb
    ports:
      - "8000:8000"
    command: start --log trace --user root --pass root file://data/database.db
    volumes:
      - surreal_data:/data
    restart: unless-stopped

volumes:
  surreal_data:
