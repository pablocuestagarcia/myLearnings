services:
  postgres:
    image: pgvector/pgvector:16
    container_name: local-postgres-advanced
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: advanced_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d advanced_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
