[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

# Lee los logs JSON de todos los contenedores Docker del host
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /tmp/flb_docker.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# Enriquecer con metadatos (nombre del contenedor) extraídos de la ruta
[FILTER]
    Name      parser
    Match     docker.*
    Key_Name  log
    Parser    docker_no_time
    Reserve_Data On

[OUTPUT]
    Name            opensearch
    Match           *
    Host            opensearch
    Port            9200
    Index           docker-logs
    Logstash_Format On
    Logstash_Prefix docker-logs
    Suppress_Type_Name On
    Replace_Dots    On
    Retry_Limit     False
