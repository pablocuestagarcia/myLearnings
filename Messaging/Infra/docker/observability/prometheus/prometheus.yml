global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Kafka — via kminion (Redpanda Data)
  # kminion expone /metrics en el puerto 8080 dentro de la red Docker.
  - job_name: kafka
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-kminion:8080"]

  # NATS — pendiente. Plantilla: prometheus-nats-exporter expone /metrics en 7777.
  # - job_name: nats
  #   static_configs:
  #     - targets: ["nats-exporter:7777"]
